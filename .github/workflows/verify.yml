name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Render synthetic demo
        run: >-
          python scripts/render.py --project examples/demo
          --data examples/demo/progress/timeline.json --output examples/demo/site
