<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>项目开发进度</title>
<style>
:root{--ink:#20354c;--muted:#5c7084;--line:#dce5ee;--blue:#155cb4;--paper:#fff;--wash:#f3f6fa;--green:#13704f;--red:#a73d36;--amber:#916019}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:var(--blue)}:focus-visible{outline:3px solid #2170cf;outline-offset:3px}header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px}.brand{font-size:22px;font-weight:650;display:flex;align-items:center;gap:12px}.arc{width:26px;height:26px;border:2px solid #cedcea;border-top-color:var(--blue);border-right-color:var(--blue);border-radius:50%}.meta{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:28px 18px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}.task-group{margin:24px 10px 8px;color:var(--muted);font-size:12px}.task{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px;color:var(--ink);margin:3px 0}.task small{display:block;font-size:12px;color:var(--muted)}.task[aria-pressed=true]{background:#e2edf9;color:#104b95}.state{float:right;font-size:11px;font-weight:400;line-height:23px}.task span.title{display:block;clear:both;font-size:13px}.aside-foot{border-top:1px solid var(--line);margin-top:26px;padding:16px 10px;font-size:12px;color:var(--muted)}main{min-width:0;padding:34px 46px 70px;background:white;min-height:calc(100vh - 76px);border-left:1px solid var(--line)}h1{font-size:29px;line-height:1.35;margin:0 0 12px;letter-spacing:-.5px}h2{font-size:20px;margin:0}p{margin:0 0 12px}.overview{padding-bottom:25px;border-bottom:1px solid var(--line)}.statusline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:14px}.statusdot{width:7px;height:7px;background:var(--amber);border-radius:50%}.summary{max-width:850px;color:#38536f;font-size:16px}.next{padding:12px 16px;background:#f0f5fb;border-left:3px solid var(--blue);font-size:14px;margin:16px 0 8px}.next b{margin-right:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:22px 0 12px;align-items:center}input{min-width:180px;flex:1}input,select,.plain{background:white;border:1px solid #ccd8e5;border-radius:6px;padding:8px 11px;color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:20px;padding:4px 13px;color:var(--muted);background:white;font-size:13px}.filter[aria-pressed=true]{border-color:var(--blue);background:#eff5fc;color:var(--blue)}.count{margin:18px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px}.day{display:grid;grid-template-columns:100px minmax(0,1fr);column-gap:24px}.date{padding-top:15px;align-self:start;position:sticky;top:14px}.date b{font-size:18px;display:block}.date small{font-size:12px;color:var(--muted)}.entries{border-left:1px solid #cedcea;padding-left:26px}.event{position:relative;padding:15px 0 21px;border-bottom:1px solid #e7edf3}.event:last-child{border-bottom:0;margin-bottom:18px}.event:before{content:"";position:absolute;left:-31px;top:24px;width:9px;height:9px;background:var(--blue);border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #a4bbd2}.event[data-result=passed]:before{background:var(--green)}.event[data-result=failed]:before{background:var(--red)}.event[data-result=blocked]:before{background:var(--amber)}.eventtop{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:12px;color:var(--muted)}.time{font-variant-numeric:tabular-nums;min-width:38px}.badge{border-radius:4px;padding:1px 7px;background:#eff3f7;color:#52677c}.badge.passed{background:#e5f3ec;color:var(--green)}.badge.failed{background:#fae9e6;color:var(--red)}.badge.blocked{background:#fff0d7;color:var(--amber)}.event h3{font-size:17px;font-weight:600;line-height:1.5;margin:8px 0}.event p{color:#455e77;font-size:14px;max-width:850px;line-height:1.8}.scope{font-size:12px;color:var(--muted);margin-top:4px}details{font-size:13px;margin-top:10px}summary{cursor:pointer;color:var(--blue);width:fit-content}.evidence{padding:14px 16px;margin-top:10px;background:#f4f7fb;border-radius:5px}.evidence p{font-size:13px}.evidence a{overflow-wrap:anywhere}.excerpt{white-space:pre-wrap;font-size:12px;line-height:1.7;color:#53697f;border-left:2px solid #cad8e7;padding-left:12px;margin:10px 0}.coverage{border-top:1px solid var(--line);margin-top:24px;padding-top:18px;color:var(--muted);font-size:12px}.coverage li{overflow-wrap:anywhere}.empty{padding:45px 20px;background:#f5f8fb;text-align:center;color:var(--muted)}.taskfacts{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}#snapshotRefs{margin-top:10px}noscript{display:block;padding:20px}
@media(min-width:1400px){main{padding-left:70px;padding-right:70px}.layout{grid-template-columns:290px minmax(0,1fr)}}
@media(max-width:850px){header{padding:16px 20px;height:auto}.brand{font-size:18px}.layout{display:block}aside{position:static;max-height:none;padding:10px 15px;border-bottom:1px solid var(--line)}#tasks{display:flex;gap:5px;overflow:auto}.task{min-width:175px;width:auto}.task-group,.aside-foot{display:none}main{padding:25px 22px;border-left:0}h1{font-size:25px}.day{grid-template-columns:75px minmax(0,1fr);gap:10px}.date b{font-size:16px}.entries{padding-left:17px}.event:before{left:-22px}.meta{max-width:170px;text-align:right}.toolbar{gap:8px}.toolbar input{width:100%;flex-basis:100%}.count{display:block}.date{position:static}.event h3{font-size:16px}}
@media(max-width:440px){header .meta{font-size:10px}main{padding:22px 16px}.day{display:block}.date{padding:12px 0}.date b,.date small{display:inline;margin-right:8px}.entries{margin-left:5px}.filters{gap:5px}.filter{padding:4px 9px}.summary{font-size:14px}.count span{display:block;margin-top:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><style id="theme-style">/*__DEFAULT_THEME__*/</style><style>
.header-tools{display:flex;align-items:center;gap:18px}.theme-control{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.theme-control select{font-size:12px;padding:5px 8px;min-width:80px}.theme-note{font-size:10px;color:var(--amber)}.task-scroll[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.event{transition:none!important}}@media(max-width:850px){.header-tools{gap:8px;align-items:flex-end;flex-direction:column}.theme-control{font-size:10px}.theme-control select{font-size:11px;padding:3px 7px}.header-tools .meta{max-width:190px;font-size:9px}}
</style></head>
<body><header><div class="brand"><span class="arc" aria-hidden="true"></span><span id="brand">项目开发进度</span></div><div class="header-tools"><label class="theme-control">主题<select id="theme" aria-label="页面主题"><option value="clear">澄明</option><option value="night">夜航</option><option value="journal">日记</option></select><span class="theme-note" id="theme-note" role="status"></span></label><div class="meta" id="generated"></div></div></header>
<div class="layout"><aside aria-label="任务目录"><button class="task" id="allTasks" aria-pressed="true">全部进度<small>跨任务查看工作历程</small></button><div id="tasks"></div><div class="aside-foot">实现、自测、审查和验收<br>每个节点均可展开查看依据<br><br>时间均为北京时间</div></aside>
<main><section class="overview"><div class="statusline"><span class="statusdot"></span><span id="status"></span></div><h1 id="headline"></h1><p class="summary" id="summary"></p><div class="next"><b>下一步</b><span id="next"></span></div><div class="taskfacts" id="taskfacts"></div><details id="snapshotRefs"><summary>查看当前状态依据</summary><div class="evidence" id="snapshotEvidence"></div></details></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜索功能、版本、问题…" aria-label="搜索时间轴"><select id="result" aria-label="结果筛选"><option value="all">所有结果</option><option value="passed">通过</option><option value="failed">失败</option><option value="blocked">受阻</option><option value="deferred">待验证</option><option value="recorded">已记录</option></select><select id="sort" aria-label="时间排序"><option value="desc">最近在前</option><option value="asc">从开始看</option></select><button class="plain" id="reset">重置筛选</button></div>
<div class="filters" id="stages" aria-label="阶段筛选"></div><div class="day-controls"><span>按天查看</span><button type="button" id="expand-days">展开全部</button><button type="button" id="collapse-days">折叠全部</button></div><div class="count" role="status" aria-live="polite"><span id="count"></span><span>仅日期的节点单列，不推断当天先后顺序</span></div><div id="timeline"></div><section class="coverage" id="coverage"></section></main></div>
<noscript>请开启 JavaScript 查看时间轴；原始记录仍保存在项目文件中。</noscript>
<script>
const D=/*__TIMELINE_DATA__*/;
const THEMES=/*__TIMELINE_THEMES__*/;
const themeKey='project-progress-timeline:'+D.project+':theme';let activeTheme='clear';
try{const saved=localStorage.getItem(themeKey);if(Object.hasOwn(THEMES,saved))activeTheme=saved}catch{document.getElementById('theme-note').textContent='无法记忆选择'}
const requestedTheme=new URLSearchParams(location.search).get('theme');if(Object.hasOwn(THEMES,requestedTheme)){activeTheme=requestedTheme;try{localStorage.setItem(themeKey,activeTheme)}catch{document.getElementById('theme-note').textContent='无法记忆选择'}const u=new URL(location.href);u.searchParams.delete('theme');try{history.replaceState(null,'',u)}catch{}}
document.getElementById('theme-style').textContent=THEMES[activeTheme];document.documentElement.dataset.theme=activeTheme;document.getElementById('theme').value=activeTheme;
const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages={all:'全部节点',authorization:'授权 / 开工',implementation:'实现',test:'自测 / 复验',cr:'CR 审查',fix:'修复',native:'原生验收',design:'设计',handoff:'交接 / 停止',policy:'流程调整'};
const results={passed:'通过',failed:'失败',blocked:'受阻',deferred:'待验证',recorded:'已记录'},states={open:'未完成','in-progress':'实施中',done:'已完成'};
const dayOpen=new Map();
let eventSubset=null;
let task='all',stage='all';const taskMap=Object.fromEntries(D.tasks.map(t=>[t.id,t]));
function refsHTML(refs){return refs.map(r=>`<p><a href="${E(r.url)}" target="_blank" rel="noopener">${E(r.path)} · 第 ${r.line} 行</a></p><div class="excerpt">${E(r.excerpt)}</div>`).join('');}
function renderOverview(){const t=taskMap[task]||taskMap[D.current_task]||D.tasks[0];$('status').textContent=`${task==='all'?'当前主线 · ':''}${t.id} ${states[t.state]}`;$('headline').textContent=task==='all'?'开发走到哪一步了':t.title;$('summary').textContent=t.summary;$('next').textContent=t.next;$('taskfacts').textContent=`状态记录截至 ${t.as_of.replace('T',' ').replace('+08:00','')}　${task==='all'?(activeTheme==='journal'?'其他任务状态见上方目录':'其他任务状态见左侧目录'):''}`;$('snapshotEvidence').innerHTML=refsHTML(t.refs);}
function render(){renderOverview();document.querySelectorAll('[data-task]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.task===task));$('allTasks').setAttribute('aria-pressed',task==='all');document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.stage===stage));const q=$('search').value.trim().toLowerCase(),r=$('result').value,dir=$('sort').value;const es=D.events.filter(e=>(!eventSubset||eventSubset.has(e.id))&&(task==='all'||e.task===task)&&(stage==='all'||e.stages.includes(stage))&&(r==='all'||e.result===r)&&[e.title,e.summary,e.version,e.actor,e.task,e.at,taskMap[e.task].title].join(' ').toLowerCase().includes(q));const groups={};es.forEach(e=>{const day=e.at?e.at.slice(0,10):'unknown';(groups[day]??=[]).push(e)});const days=Object.keys(groups).filter(d=>d!=='unknown').sort((a,b)=>dir==='desc'?b.localeCompare(a):a.localeCompare(b));if(groups.unknown)days.push('unknown');let out='';for(const day of days){const known=groups[day].filter(e=>e.precision==='minute'||e.precision==='second').sort((a,b)=>dir==='desc'?new Date(b.at)-new Date(a.at):new Date(a.at)-new Date(b.at));const unknown=groups[day].filter(e=>e.precision==='day'||e.precision==='unknown');const filtered=task!=='all'||stage!=='all'||q||r!=='all';const isOpen=dayOpen.has(day)?dayOpen.get(day):(filtered||day===days[0]);const totals=Object.fromEntries(Object.keys(results).map(k=>[k,groups[day].filter(e=>e.result===k).length]));out+=`<details class="day" data-day="${day}" ${isOpen?'open':''}><summary class="date"><b>${day==='unknown'?'日期未记':E(day.slice(5).replace('-',' / '))}</b><small>${day==='unknown'?'保持未核实':E(day.slice(0,4))}</small><span class="day-total">${groups[day].length}条记录 · ${new Set(groups[day].map(e=>e.task)).size}项任务</span><span class="day-results">${Object.entries(totals).filter(([k,n])=>n).map(([k,n])=>`<span class="day-result ${k}">${results[k]} ${n}</span>`).join('')}</span></summary><div class="entries">`;for(const e of [...known,...unknown]){const time=e.precision==='day'?'仅日期':e.precision==='unknown'?'未记时间':e.at.slice(11,e.precision==='second'?19:16);out+=`<article class="event" data-result="${E(e.result)}" data-event="${E(e.id)}"><div class="eventtop"><span class="time">${E(time)}${e.time_basis==='recorded'?' 记录':''}</span><span>${E(e.task)}</span><span>${E(e.stages.map(s=>stages[s]).join(' / '))}</span><span class="badge ${E(e.result)}">${results[e.result]}</span></div><h3>${E(e.title)}</h3><details><summary>详情与依据（${e.refs.length}）</summary><p>${E(e.summary)}</p><div class="scope">${E(e.scope)}${e.version?' · 版本 '+E(e.version):''}${e.actor?' · '+E(e.actor):''}</div><div class="evidence">${refsHTML(e.refs)}</div></details></article>`}out+='</div></details>'}$('timeline').innerHTML=out||'<div class="empty">没有匹配节点。清除搜索或重置筛选后继续查看。</div>';$('count').textContent=`显示 ${es.length} / ${D.events.length} 个节点`;}
$('timeline').addEventListener('toggle',e=>{if(e.target.matches('details.day')&&$('timeline').contains(e.target))dayOpen.set(e.target.dataset.day,e.target.open)},true);
for(const [id,open] of [['expand-days',true],['collapse-days',false]])$(id).onclick=()=>{document.querySelectorAll('#timeline details.day').forEach(d=>{dayOpen.set(d.dataset.day,open);d.open=open})};
$('brand').textContent=D.project;document.title=D.project+' · 开发时间轴';$('generated').textContent=`生成于 ${D.generated_at.slice(0,16).replace('T',' ')} · 按需刷新`;
const laneNames={implementation:'功能开发',design:'设计验证',planning:'规划 / 研究',...(D.lanes||{})};const lanes=Object.fromEntries([...new Set(D.tasks.map(t=>t.lane))].map(lane=>[lane,laneNames[lane]||lane]));let ts='';for(const [lane,label]of Object.entries(lanes)){ts+=`<div class="task-group">${E(label)}</div>`;for(const t of D.tasks.filter(t=>t.lane===lane))ts+=`<button class="task" data-task="${E(t.id)}" aria-pressed="false">${E(t.id)}<span class="state">${states[t.state]}</span><span class="title">${E(t.title)}</span></button>`}$('tasks').innerHTML=ts;$('stages').innerHTML=Object.entries(stages).map(([key,name])=>`<button class="filter" data-stage="${key}" aria-pressed="${key==='all'}">${name}</button>`).join('');$('tasks').addEventListener('click',e=>{const b=e.target.closest('[data-task]');if(b){task=b.dataset.task;eventSubset=null;render()}});$('allTasks').onclick=()=>{task='all';eventSubset=null;render()};$('stages').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b){stage=b.dataset.stage;eventSubset=null;render()}});['search','result','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{eventSubset=null;render()}));$('reset').onclick=()=>{eventSubset=null;task='all';stage='all';$('search').value='';$('result').value='all';$('sort').value='desc';render()};
const c=D.coverage;$('coverage').innerHTML=`本次聚合 ${D.events.length} 个关键节点，引用 ${c.referenced_files} 份记录；扫描范围内共 ${c.candidate_files} 份候选 Markdown。<br>这是已核对的关键节点快照，候选文件可能包含草案、重复报告与尚未聚合的细节。缺失记录保持可见，完成率不按节点数计算。<details><summary>查看 ${c.unreferenced.length} 份未引用候选记录</summary><ul>${c.unreferenced.map(p=>`<li>${E(p)}</li>`).join('')}</ul></details>`;render();

const taskList=$('tasks'),scrollButtons=[];
for(const [direction,label,symbol] of [[-1,'显示前面的任务','‹'],[1,'显示后续任务','›']]){const b=document.createElement('button');b.className='task-scroll';b.setAttribute('aria-label',label);b.textContent=symbol;b.onclick=()=>taskList.scrollBy({left:direction*350,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});if(direction===-1)taskList.before(b);else taskList.after(b);scrollButtons.push([b,direction]);}
function updateThemeNavigation(){for(const [b,d]of scrollButtons){b.hidden=activeTheme!=='journal';b.disabled=d===-1?taskList.scrollLeft<2:taskList.scrollLeft+taskList.clientWidth>=taskList.scrollWidth-2;}}
taskList.addEventListener('scroll',updateThemeNavigation);window.addEventListener('resize',updateThemeNavigation);
$('theme').onchange=()=>{activeTheme=$('theme').value;$('theme-style').textContent=THEMES[activeTheme];document.documentElement.dataset.theme=activeTheme;try{localStorage.setItem(themeKey,activeTheme);$('theme-note').textContent=''}catch{$('theme-note').textContent='无法记忆选择'}renderOverview();updateThemeNavigation();};
updateThemeNavigation();
</script></body></html>
